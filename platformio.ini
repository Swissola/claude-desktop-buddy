[platformio]
; Default env for bare `pio run` and for VS Code IntelliSense indexing
; (so c_cpp_properties.json targets a real env, not a stale/deleted one).
default_envs = m5stack-sticks3

[common]
platform = espressif32
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
board_build.filesystem = littlefs
build_src_filter = +<*> +<buddies/>
build_flags =
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    m5stack/M5Unified @ ^0.2.0
    m5stack/M5GFX @ ^0.2.0
    bitbank2/AnimatedGIF @ ^2.1.1
    bblanchon/ArduinoJson @ ^7.0.0

[env:m5stickc-plus]
extends = common
board = m5stick-c
board_build.variant = m5stack_stickc_plus   ; arduino-esp32 3.3.9 renamed m5stick_c → m5stack_stickc_plus
board_build.partitions = no_ota.csv
board_build.f_cpu = 160000000L

[env:m5stack-sticks3]
extends = common
board = esp32-s3-devkitc-1
; ESP32-S3-PICO-1 here has 8MB QUAD PSRAM @3.3V (esptool eFuse: "AP_3v3"),
; NOT octal. qio_opi (octal/1.8V) bootlooped the board on early PSRAM init;
; qio_qspi = QIO flash + QUAD-SPI PSRAM matches the silicon. See debug/sticks3-bootloop.
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 8MB
board_build.partitions = partitions_8mb.csv
; PSRAM DISABLED: the AP_3v3 8MB quad PSRAM does not enumerate with the prebuilt
; IDF quad-PSRAM driver. With CONFIG_SPIRAM=y, arduino-esp32's pre-setup()
; ESP_SYSTEM_INIT_FN(init_psram_new) -> psramInit() probe corrupts memory and
; panics (LoadProhibited) before app code runs -> deterministic black-screen
; bootloop. CONFIG_SPIRAM=n removes that init hook (framework recompile). The app
; uses only ~66KB of 327KB internal SRAM and runs PSRAM-free on the StickC Plus
; (classic ESP32, no PSRAM) already. See debug/sticks3-bootloop.
custom_sdkconfig = CONFIG_SPIRAM=n
build_flags =
    ${common.build_flags}
    -DBOARD_STICKS3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
