[platformio]
; Default env for bare `pio run` and for VS Code IntelliSense indexing
; (so c_cpp_properties.json targets a real env, not a stale/deleted one).
default_envs = m5stack-sticks3

[common]
platform = espressif32
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
board_build.filesystem = littlefs
build_src_filter = +<*> +<buddies/>
build_flags =
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    m5stack/M5Unified @ ^0.2.0
    m5stack/M5GFX @ ^0.2.0
    bitbank2/AnimatedGIF @ ^2.1.1
    bblanchon/ArduinoJson @ ^7.0.0

[env:m5stickc-plus]
extends = common
board = m5stick-c
board_build.variant = m5stack_stickc_plus   ; arduino-esp32 3.3.9 renamed m5stick_c → m5stack_stickc_plus
board_build.partitions = no_ota.csv
board_build.f_cpu = 160000000L

[env:m5stack-sticks3]
extends = common
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 8MB
board_build.partitions = partitions_8mb.csv
build_flags =
    ${common.build_flags}
    -DBOARD_STICKS3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
